name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macOS runner: the app is AppKit/SwiftUI and the backend shells out to
    # hdiutil and ditto, so nothing here is portable to Linux.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-backend/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-backend/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path rust-backend/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path rust-backend/Cargo.toml

      - name: Swift build
        run: swift build

      - name: Swift tests
        run: swift test
